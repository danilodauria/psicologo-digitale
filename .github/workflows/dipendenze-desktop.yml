name: "Pacchetto desktop sulle pull request"

# Un aggiornamento di Electron o di electron-builder non si giudica dai test
# del sito: si giudica costruendo il pacchetto. Qui gira su tutti e tre i
# sistemi, con lo stesso confronto degli archivi della release, prima che
# qualcuno fonda la pull request. Non pubblica niente: gli archivi restano
# allegati all'esecuzione e vengono elencati in un commento della pull
# request, con link e impronta SHA-256. Sette giorni, poi si cancellano.
#
# Il lavoro «esito» gira sempre, anche quando non c'è niente da costruire:
# è quello che la protezione del ramo pretende verde prima di ogni fusione.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "pacchetto-pr-${{ github.ref }}"
  cancel-in-progress: true

env:
  # Oltre questa soglia il commento avverte: il pacchetto è cresciuto e vale
  # la pena guardare cosa è entrato prima di fondere.
  SOGLIA_MB: "300"

jobs:
  rileva:
    name: Il pacchetto è toccato?
    runs-on: ubuntu-latest
    outputs:
      toccato: ${{ steps.files.outputs.toccato }}
    steps:
      - name: Quali file cambia la pull request
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMERO: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "toccato=1" >> "$GITHUB_OUTPUT"
            echo "Avvio manuale: si costruisce."
            exit 0
          fi
          # Senza checkout il comando ha bisogno che il repository sia detto.
          cambi=$(gh pr view "$NUMERO" --repo "$REPO" --json files \
            -q '[.files[].path] | join(" ")')
          # Sono i file che prepare-desktop.cjs mette dentro il programma:
          # pagine, assets, licenze, README, più gli script che lo preparano.
          if grep -qE '(^| )(desktop/|assets/|scripts/prepare-desktop\.cjs|scripts/controlla-archivi\.cjs|[^ ]*\.html|sw\.js|manifest\.webmanifest|README\.md|LICENSE|LICENSE-CONTENT\.md)' <<< "$cambi"; then
            echo "toccato=1" >> "$GITHUB_OUTPUT"
            echo "Il pacchetto cambia: si costruisce su tre sistemi."
          else
            echo "toccato=0" >> "$GITHUB_OUTPUT"
            echo "Il pacchetto non cambia: niente build."
          fi

  pacchetto:
    name: ${{ matrix.nome }}
    needs: rileva
    if: needs.rileva.outputs.toccato == '1'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nome: Linux
            sistema: linux
            script: dist:linux
          - os: windows-latest
            nome: Windows
            sistema: windows
            script: dist:win
          - os: macos-15-intel
            nome: macOS
            sistema: macos
            script: dist:mac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Pacchetto del sito
        run: node scripts/prepare-desktop.cjs

      - name: Dipendenze del desktop
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # electron-builder chiama after-pack.cjs, che apre l'asar e lo confronta
      # con desktop/app: se un file manca o è alterato, il passo fallisce.
      - name: Costruzione e confronto dell'archivio
        working-directory: desktop
        run: npm run ${{ matrix.script }}

      # electron-builder produce l'installer, non la cartella portatile: lo ZIP
      # si crea qui, come fa il workflow dei pacchetti veri.
      - name: Crea la versione portatile (ZIP)
        if: matrix.sistema == 'windows'
        shell: pwsh
        run: Compress-Archive -Path desktop/dist/win-unpacked/* -DestinationPath "desktop/dist/Psicologo-Digitale-Windows-portatile.zip"

      - name: Quali archivi sono usciti
        shell: bash
        run: ls -la desktop/dist

      # L'impronta si calcola sui file veri, non sul contenitore caricato: chi
      # scarica può confrontarla con il proprio archivio estratto.
      - name: Impronte SHA-256 degli archivi
        shell: bash
        run: |
          {
            for f in desktop/dist/*.deb desktop/dist/*.zip desktop/dist/*.exe desktop/dist/*.dmg; do
              [ -e "$f" ] || continue
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $(basename "$f")"
            done
          } | tee "impronte-${{ matrix.nome }}.txt"

      - name: Allega gli archivi alla pull request
        uses: actions/upload-artifact@v7
        with:
          name: pacchetto-${{ matrix.nome }}
          path: |
            desktop/dist/*.deb
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Allega le impronte (pochi byte)
        uses: actions/upload-artifact@v7
        with:
          name: impronte-${{ matrix.nome }}
          path: impronte-${{ matrix.nome }}.txt
          if-no-files-found: error
          retention-days: 7

  # Un commento solo, aggiornato a ogni esecuzione invece di uno nuovo ogni
  # volta: si legge scorrendo la pull request senza cercare l'ultimo.
  commento:
    name: Commento con i link agli archivi
    needs: [rileva, pacchetto]
    if: needs.rileva.outputs.toccato == '1' && needs.pacchetto.result == 'success' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica solo le impronte
        uses: actions/download-artifact@v7
        with:
          pattern: impronte-*
          path: impronte
          merge-multiple: true

      - name: Scrivi e pubblica il commento
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMERO: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_id }}
        run: |
          # L'ordine dell'API non è garantito: si impone Linux, Windows, macOS.
          righe=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("pacchetto-")) | [.name, (.size_in_bytes|tostring), .expires_at, (.id|tostring)] | @tsv' \
            | awk 'BEGIN { FS = OFS = "\t" } { r = 9; if ($1 ~ /-Linux$/) r = 1; else if ($1 ~ /-Windows$/) r = 2; else if ($1 ~ /-macOS$/) r = 3; print r, $0 }' \
            | sort -n | cut -f2-)

          : > /tmp/righe.txt
          pesanti=""
          totale_mb=0
          while IFS=$'\t' read -r nome byte scadenza id; do
            [ -n "$nome" ] || continue
            mb=$(awk -v b="$byte" 'BEGIN { printf "%.1f", b / 1048576 }')
            giorno=$(date -u -d "$scadenza" "+%d/%m/%Y")
            printf '%s\t%s\t%s\t%s\n' "$nome" "$mb" "$giorno" "$id" >> /tmp/righe.txt
            if awk -v m="$mb" -v s="$SOGLIA_MB" 'BEGIN { exit !(m > s) }'; then
              pesanti="$pesanti, ${nome#pacchetto-}"
              echo "::warning::${nome} pesa ${mb} MB: oltre la soglia di ${SOGLIA_MB} MB." >&2
            fi
            totale_mb=$(awk -v t="$totale_mb" -v m="$mb" 'BEGIN { printf "%.1f", t + m }')
          done <<< "$righe"

          {
            echo "<!-- archivi-pr -->"
            echo "### Archivi pronti da provare"
            echo ""
            echo "Costruiti su Linux, Windows e macOS da [questa esecuzione](https://github.com/$REPO/actions/runs/$RUN), con il confronto dei file dentro l'archivio. Restano scaricabili sette giorni, poi si cancellano da soli."
            echo ""
            echo "| Sistema | Archivio | Peso | Scade il |"
            echo "|---|---|---|---|"
            while IFS=$'\t' read -r nome mb giorno id; do
              echo "| ${nome#pacchetto-} | [${nome}](https://github.com/$REPO/actions/runs/$RUN/artifacts/$id) | ${mb} MB | ${giorno} |"
            done < /tmp/righe.txt
            echo ""
            echo "Totale: ${totale_mb} MB in tutti gli archivi (soglia di avviso: ${SOGLIA_MB} MB per archivio)."
            if [ -n "$pesanti" ]; then
              echo ""
              echo "> **Attenzione:** oltre la soglia di ${SOGLIA_MB} MB — ${pesanti#, }. Un peso così vuol dire che il pacchetto è cresciuto: conviene guardare cosa è entrato prima di fondere."
            fi
            echo ""
            echo "**Impronte SHA-256** (sui file dentro l'archivio, non sul contenitore scaricato):"
            echo ""
            echo '```'
            cat impronte/*.txt | sort -k2
            echo '```'
            echo ""
            echo "Per controllare: \`sha256sum <file>\` su Linux e macOS, \`Get-FileHash <file> -Algorithm SHA256\` su Windows. Se l'impronta non corrisponde, il file non è quello costruito qui."
          } > /tmp/commento.md

          esistente=$(gh api "repos/$REPO/issues/$NUMERO/comments" --paginate \
            --jq '[.[] | select(.body | contains("<!-- archivi-pr -->"))][0].id // ""')
          if [ -n "$esistente" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$esistente" -F body=@/tmp/commento.md > /dev/null
            echo "Commento aggiornato ($esistente)."
          else
            gh api -X POST "repos/$REPO/issues/$NUMERO/comments" -F body=@/tmp/commento.md > /dev/null
            echo "Commento creato."
          fi

  esito:
    name: "Pacchetto desktop: esito"
    needs: [rileva, pacchetto]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Giudizio
        run: |
          if [ "${{ needs.rileva.outputs.toccato }}" != "1" ]; then
            echo "Il pacchetto non è toccato: nessuna build da attendere."
            exit 0
          fi
          if [ "${{ needs.pacchetto.result }}" = "success" ]; then
            echo "Linux, Windows e macOS hanno costruito e confrontato il pacchetto."
            exit 0
          fi
          echo "::error::La build del pacchetto non è passata: la fusione resta ferma."
          exit 1
