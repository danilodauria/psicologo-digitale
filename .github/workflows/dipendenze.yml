name: Dipendenze

# Dependabot propone gli aggiornamenti; qui passano dai controlli veri del
# progetto e, se sono aggiornamenti ordinari (patch o minor) del sito, vengono
# fusi senza intervento. Un major resta a una persona: cambia troppo per fidarsi
# di un test automatico, soprattutto per Electron. Un aggiornamento che tocca
# il pacchetto desktop non viene mai fuso qui: prima deve costruire, in
# «Dipendenze: pacchetto desktop», su Linux, Windows e macOS.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "dipendenze-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  controlla:
    name: Controlli e fusione
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Dipendenze
        run: npm ci --no-audit --no-fund

      - name: Che tipo di aggiornamento
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tocca il pacchetto desktop?
        id: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cambi=$(gh pr view "${{ github.event.pull_request.number }}" --json files \
            -q '[.files[].path] | join(" ")')
          if grep -qE '(^| )desktop/' <<< "$cambi"; then
            echo "toccato=1" >> "$GITHUB_OUTPUT"
            echo "La pull request tocca desktop/: la fusione aspetta la build."
          else
            echo "toccato=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Tutti i controlli
        run: npm test

      - name: Fusione automatica
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          steps.desktop.outputs.toccato == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash --delete-branch "${{ github.event.pull_request.number }}"

      - name: Un major aspetta una persona
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "::notice::Aggiornamento major: controlli eseguiti, la fusione resta a una persona."

      - name: Il pacchetto desktop aspetta la sua build
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          steps.desktop.outputs.toccato == '1'
        run: |
          echo "::notice::Aggiornamento del desktop: la fusione aspetta la build dei tre sistemi."
