name: Pacchetti desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*", "psd-v*"]

permissions:
  contents: write

concurrency:
  group: "desktop-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    # Le build servono per i tag; su main gira solo il job delle impronte.
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/psd-v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
          - os: windows-latest
            script: dist:win
            artifact: windows
          # Runner Intel: da lì si compilano entrambe le architetture macOS.
          - os: macos-15-intel
            script: dist:mac
            artifact: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Prepara il contenuto dell'app
        run: node scripts/prepare-desktop.cjs

      - name: Installa Electron
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # Nessun certificato, per scelta: i pacchetti escono con la sola firma
      # ad-hoc applicata da desktop/after-pack.cjs. Qui non ci sono secret di
      # firma da configurare, e le istruzioni per il primo avvio stanno nel
      # README e dentro il programma.
      - name: Genera i pacchetti
        working-directory: desktop
        shell: bash
        run: |
          # Su macOS hdiutil a volte non riesce a smontare l'immagine appena
          # creata: il volume resta agganciato e fa fallire anche il tentativo
          # successivo allo stesso punto. Si riprova, insistendo sullo smontaggio.
          ok=0
          for tentativo in 1 2 3 4; do
            if npm run ${{ matrix.script }}; then ok=1; break; fi
            echo "::warning::Tentativo $tentativo non riuscito."
            if [ "${{ matrix.artifact }}" = "macos" ]; then
              for giro in 1 2 3 4 5; do
                hdiutil info | grep -q "/Volumes/Psicologo" || break
                diskutil unmount force "/Volumes/Psicologo Digitale" >/dev/null 2>&1 || true
                hdiutil detach -force "/Volumes/Psicologo Digitale" >/dev/null 2>&1 || true
                sleep 4
              done
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Nessuno dei quattro tentativi è riuscito."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Crea la versione portatile (ZIP)
        if: matrix.artifact == 'windows'
        shell: pwsh
        run: Compress-Archive -Path desktop/dist/win-unpacked/* -DestinationPath "desktop/dist/Psicologo-Digitale-Windows-portatile.zip"

      # La firma ad-hoc non è una firma Apple: Gatekeeper chiede conferma una
      # volta sola. Va però verificata, perché un bundle con la firma rotta su
      # Apple Silicon non parte affatto, e il guasto arriverebbe all'utente.
      - name: Verifica la firma macOS
        if: matrix.artifact == 'macos'
        shell: bash
        run: |
          app="$(ls -d desktop/dist/mac*/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          firma="$(codesign -dv --verbose=4 "$app" 2>&1 | grep -E '^Signature=' || true)"
          echo "::notice::macOS: firma ad-hoc valida ($firma). Il primo avvio chiede conferma una volta sola."

      - name: Carica gli artefatti
        uses: actions/upload-artifact@v4
        with:
          name: psicologo-digitale-${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.deb
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

      # latest*.yml sono i file che il programma installato legge per sapere che
      # esiste una versione nuova: senza di loro l'aggiornamento automatico tace.
      - name: Pubblica nella release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.deb
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/latest*.yml
          overwrite_files: true
          generate_release_notes: true

  # Un archivio unico con tutto il progetto, per chi vuole lavorarci o
  # conservarne una copia: si scarica dalla stessa pagina dei pacchetti e si
  # apre con doppio clic anche su Windows.
  backup:
    name: Backup dei sorgenti
    needs: build
    if: >-
      always() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/psd-v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crea l'archivio completo
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip \
            --prefix="psicologo-digitale-${GITHUB_REF_NAME}/" \
            -o "Psicologo-Digitale-Sorgenti.zip" HEAD
          unzip -l "Psicologo-Digitale-Sorgenti.zip" | tail -3
          du -h "Psicologo-Digitale-Sorgenti.zip"

      - name: Allega il backup alla release
        uses: softprops/action-gh-release@v2
        with:
          files: Psicologo-Digitale-Sorgenti.zip
          overwrite_files: true

  checksums:
    name: Impronte SHA-256
    needs: [build, backup]
    if: >-
      always() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/psd-v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Individua la release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)"
          fi
          if [[ -z "$tag" ]]; then
            echo "::notice::Nessuna release pubblicata, niente impronte da calcolare."
            echo "pronta=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pronta=1" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release di riferimento: $tag"

      - name: Genera SHA256SUMS.txt
        id: somme
        if: steps.rel.outputs.pronta == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          DA_TAG: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/psd-v') }}
        run: |
          set -euo pipefail
          # GitHub calcola il digest SHA-256 di ogni allegato al caricamento:
          # leggerlo dall'API evita di riscaricare centinaia di megabyte.
          for tentativo in $(seq 1 10); do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '
              .assets[]
              | select(.name | startswith("Psicologo-Digitale-"))
              | select(.digest != null and (.digest | startswith("sha256:")))
              | "\(.digest | sub("^sha256:"; ""))  \(.name)"' 2>/dev/null | sort -k2 > SHA256SUMS.txt || true
            righe="$(wc -l < SHA256SUMS.txt)"
            echo "Impronte disponibili: $righe"
            if [[ "$righe" -ge 6 ]]; then
              echo "pronte=1" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 30
          done
          cat SHA256SUMS.txt
          if [[ "$(wc -l < SHA256SUMS.txt)" -lt 6 ]]; then
            if [[ "$DA_TAG" == "true" ]]; then
              echo "::warning::Meno di sei file con impronta nella release $TAG."
            fi
            echo "pronte=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Allega SHA256SUMS.txt
        if: steps.somme.outputs.pronte == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

  completezza:
    name: Controllo che la release sia completa
    needs: [checksums]
    if: >-
      always() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/psd-v'))
    runs-on: ubuntu-latest
    steps:
      # Un pacchetto che manca non si nota subito: si nota quando qualcuno
      # clicca il link e trova un 404. Questo passaggio rende rossa la build.
      # Jobs senza checkout: gh ha bisogno di sapere quale repository guardare.
      - name: Verifica pacchetti, backup e impronte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          attesi=(
            Psicologo-Digitale-Windows-x64.exe
            Psicologo-Digitale-Windows-portatile.zip
            Psicologo-Digitale-Linux-amd64.deb
            Psicologo-Digitale-Linux-x86_64.AppImage
            Psicologo-Digitale-Mac-arm64.dmg
            Psicologo-Digitale-Mac-x64.dmg
          )
          # File di servizio per l'aggiornamento automatico: chi ha il
          # programma installato li legge per scoprire le nuove versioni.
          servizio=(latest.yml latest-mac.yml latest-linux.yml)
          # Copia completa del progetto: serve a chi vuole ricostruire o
          # conservare il pacchetto senza dipendere da questo repository.
          extra=(Psicologo-Digitale-Sorgenti.zip)
          presenti="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name')"
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP/rel" --clobber \
            || { echo "::error::Manca SHA256SUMS.txt nella release $TAG."; exit 1; }
          mancanti=0
          for f in "${attesi[@]}"; do
            if grep -qxF "$f" <<< "$presenti"; then
              echo "✓ $f"
            else
              echo "::error::Manca $f nella release $TAG."
              mancanti=$((mancanti + 1))
            fi
            if grep -q "  $f\$" "$RUNNER_TEMP/rel/SHA256SUMS.txt"; then
              echo "  impronta presente"
            else
              echo "::error::Manca l'impronta di $f in SHA256SUMS.txt."
              mancanti=$((mancanti + 1))
            fi
          done
          for f in "${servizio[@]}"; do
            if grep -qxF "$f" <<< "$presenti"; then
              echo "✓ $f"
            else
              echo "::error::Manca $f: senza questo file il programma installato non vede le nuove versioni."
              mancanti=$((mancanti + 1))
            fi
          done
          for f in "${extra[@]}"; do
            if grep -qxF "$f" <<< "$presenti"; then
              echo "✓ $f"
            else
              echo "::error::Manca $f: senza il backup la release non è completa."
              mancanti=$((mancanti + 1))
            fi
            if grep -q "  $f\$" "$RUNNER_TEMP/rel/SHA256SUMS.txt"; then
              echo "  impronta presente"
            else
              echo "::error::Manca l'impronta di $f in SHA256SUMS.txt."
              mancanti=$((mancanti + 1))
            fi
          done
          if [[ "$mancanti" -gt 0 ]]; then
            echo "::error::Release incompleta: $mancanti controlli falliti."
            exit 1
          fi
          echo "Release completa: ${#attesi[@]} pacchetti con la loro impronta, ${#servizio[@]} file di aggiornamento e il backup dei sorgenti."
