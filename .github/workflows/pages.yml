name: Test e pubblicazione

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Verifiche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Pubblicazione
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara l'artefatto pubblico
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' \
            --exclude 'tests/' --exclude 'scripts/' --exclude 'package.json' \
            --exclude 'package-lock.json' ./ "$RUNNER_TEMP/site/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: pages
        uses: actions/deploy-pages@v4
